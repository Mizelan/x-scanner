<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>x-scanner fixture timeline</title>
<style>
  /* Looks enough like X for a screenshot; the markup below is what matters. */
  body { margin:0; background:#000; color:#e7e9ea; font: 15px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  [data-testid="primaryColumn"] { width: 600px; margin: 0 auto; border-left:1px solid #2f3336; border-right:1px solid #2f3336; min-height:100vh; }
  header.top { position: sticky; top:0; background: rgba(0,0,0,.75); backdrop-filter: blur(8px); padding: 14px 16px; font-weight: 700; border-bottom:1px solid #2f3336; }
  [data-testid="cellInnerDiv"] { border-bottom: 1px solid #2f3336; }
  article { display:flex; gap:12px; padding: 12px 16px 6px; }
  .avatar { width:40px; height:40px; border-radius:50%; background:#3a3f44; flex: none; }
  .col { flex:1; min-width:0; }
  [data-testid="User-Name"] { display:flex; gap:6px; align-items:baseline; color:#71767b; }
  [data-testid="User-Name"] a { color:inherit; text-decoration:none; }
  [data-testid="User-Name"] .name { color:#e7e9ea; font-weight:700; }
  .ad { margin-left:auto; font-size: 13px; }
  [data-testid="tweetText"] { white-space: pre-wrap; margin-top: 2px; word-wrap: break-word; }
  [data-testid="tweetText"] img { width:1.2em; height:1.2em; vertical-align:-0.2em; }
  div[role="link"] { border:1px solid #2f3336; border-radius: 16px; padding: 12px; margin-top: 10px; }
  .media { height: 260px; border-radius: 16px; background: linear-gradient(135deg,#1f2a36,#0c1218); margin-top:10px; }
  .replying { color:#71767b; font-size:14px; }
  .replying a { color:#1d9bf0; text-decoration:none; }
  div[role="group"] { display:flex; justify-content:space-between; max-width: 420px; color:#71767b; padding: 6px 0 4px; font-size: 13px; }
  div[role="group"] button { background:none; border:0; color:inherit; font: inherit; cursor:pointer; }
  .spacer { }
</style>
</head>
<body>
<div id="nav" style="position:fixed;left:16px;top:16px"><a data-testid="AppTabBar_Profile_Link" href="/demo_user" style="color:#71767b;text-decoration:none">@demo_user</a></div>
<div data-testid="primaryColumn">
  <header class="top">Home</header>
  <section role="region" aria-label="Timeline">
    <div id="list"></div>
  </section>
</div>
<script>
(async () => {
  const samples = await (await fetch('/samples.json')).json();
  const REPEAT = Number(new URLSearchParams(location.search).get('repeat') || 3);
  const items = [];
  for (let r = 0; r < REPEAT; r++) for (const s of samples) items.push({ ...s, id: String(1000 + items.length), key: s.key + '_' + r });
  const list = document.getElementById('list');

  function esc(s) { return s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
  function textHtml(t) {
    // emoji become <img alt> like on X, URLs become anchors
    return esc(t)
      .replace(/([\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}])/gu, '<img alt="$1" src="data:image/gif;base64,R0lGODlhAQABAAAAACw=">')
      .replace(/((?:https?:\/\/)?[a-z0-9.-]+\.(?:com|ai|io)\/[^\s]*)/gi, '<a href="https://t.co/x">$1</a>');
  }
  function article(it) {
    const a = document.createElement('article');
    a.setAttribute('data-testid', 'tweet'); a.setAttribute('role', 'article'); a.tabIndex = 0;
    const quote = it.quoted ? `<div role="link" tabindex="0"><div data-testid="User-Name"><a href="/someone"><span class="name">Someone</span></a><a href="/someone/status/${it.id}9"><time datetime="2026-09-17T10:00:00Z">Sep 17</time></a></div><div data-testid="tweetText"><span>${esc(it.quoted)}</span></div></div>` : '';
    const media = it.media ? '<div class="media" aria-label="Image"></div>' : '';
    const ad = it.promoted ? '<span class="ad">Ad</span>' : '';
    const replying = it.reply_to ? `<div class="replying"><span>Replying to </span><a href="/${it.reply_to}">@${it.reply_to}</a></div>` : '';
    a.innerHTML = `<div class="avatar"></div><div class="col">
      <div data-testid="User-Name"><a href="/${it.handle}"><span class="name">${esc(it.name)}</span></a><a href="/${it.handle}"><span>@${it.handle}</span></a><span>·</span><a href="/${it.handle}/status/${it.id}"><time datetime="2026-09-18T09:00:00Z">${it.id.slice(-1)}h</time></a>${ad}</div>
      ${replying}
      <div data-testid="tweetText"><span>${textHtml(it.text)}</span></div>
      ${quote}${media}
      <div role="group" aria-label="actions"><button>💬 ${it.id.slice(-2)}</button><button>🔁 ${it.id.slice(-1)}</button><button>♡ ${it.id.slice(-2)}0</button><button>📊 ${it.id.slice(-1)}k</button><button>↗</button></div>
    </div>`;
    return a;
  }

  // Mount everything once, then behave like a virtual list: cells far from the viewport
  // swap their article for an empty spacer of the same height and get it back when near.
  const cells = items.map((it) => {
    const cell = document.createElement('div');
    cell.setAttribute('data-testid', 'cellInnerDiv');
    cell.appendChild(article(it));
    list.appendChild(cell);
    return { it, cell, mounted: true, height: 0 };
  });
  const WINDOW = 1800;
  function virtualize() {
    const top = window.scrollY, bottom = top + innerHeight;
    for (const c of cells) {
      const r = c.cell.getBoundingClientRect();
      const y = r.top + top;
      const near = y + r.height > top - WINDOW && y < bottom + WINDOW;
      if (c.mounted && !near) {
        c.height = r.height; c.cell.textContent = ''; c.cell.style.height = c.height + 'px'; c.mounted = false;
        window.__recycled = (window.__recycled || 0) + 1;
      } else if (!c.mounted && near) {
        c.cell.style.height = ''; c.cell.appendChild(article(c.it)); c.mounted = true;
        window.__remounted = (window.__remounted || 0) + 1;
      }
    }
  }
  addEventListener('scroll', () => requestAnimationFrame(virtualize), { passive: true });
  window.__fixtureReady = true;
})();
</script>
</body>
</html>
